name: Build IPA

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Archive for iOS Device
        run: |
          # 1. 彻底关闭 Xcode 签名校验，生成包含完整原生资源的 .app
          xcodebuild archive \
            -scheme Ruddarr \
            -archivePath $(pwd)/build/Ruddarr.xcarchive \
            -skipPackagePluginValidation \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Inject Alternate Icons into Info.plist
        run: |
          APP_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app"
          PLIST_PATH="$APP_PATH/Info.plist"
          
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$PLIST_PATH" || true
          
          ICONS=("AppIconPodcasts" "AppIconMusic" "AppIconBooks" "AppIconMono" "AppIconBarbie" "AppIconPlex" "AppIconTelegram" "AppIconWarp" "AppIconATP")
          
          for ICON in "${ICONS[@]}"; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON dict" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON:CFBundleIconFiles array" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON:CFBundleIconFiles:0 string $ICON" "$PLIST_PATH" || true
          done
          
          echo "✅ 真实备用图标注册信息已成功注入 Info.plist"

      - name: Native macOS Codesign & Entitlements Sanitizer
        run: |
          APP_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app"
          
          # 2. 提取 Xcode 生成的默认权限文件
          codesign -d --entitlements :- "$APP_PATH" > main.entitlements || echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict></dict></plist>' > main.entitlements
          
          # 3. 核心修复：强行剔除会导致巨魔闪退的"云端服务器强绑定"权限
          echo "正在清洗 entitlements 中的越界权限..."
          # 剔除远程推送权限
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" main.entitlements || true
          # 剔除 iCloud 同步与键值存储权限
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.icloud-container-identifiers" main.entitlements || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.icloud-services" main.entitlements || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.ubiquity-kvstore-identifier" main.entitlements || true
          
          # 4. 为所有的应用扩展 (NotificationService) 重签
          if [ -d "$APP_PATH/PlugIns" ]; then
            find "$APP_PATH/PlugIns" -name "*.appex" | while read appex; do
              echo "  - 正在用 Apple 官方工具重签扩展: $(basename "$appex")"
              # 扩展通常不需要复杂权限，直接用空权限重签以防闪退
              codesign --force --sign - "$appex"
            done
          fi
          
          # 5. 为主程序重签 (注入清洗后的本地安全权限)
          echo "✅ 正在用清洗后的 entitlements 重签主程序..."
          codesign --force --sign - --entitlements main.entitlements "$APP_PATH"

      - name: Create IPA
        run: |
          APP_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Ruddarr.ipa Payload
          rm -rf Payload build main.entitlements

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ruddarr.ipa
          path: Ruddarr.ipa
