name: Build IPA

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Archive for iOS Device
        run: |
          xcodebuild archive \
            -scheme Ruddarr \
            -archivePath $(pwd)/build/Ruddarr.xcarchive \
            -skipPackagePluginValidation \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Inject Alternate Icons into Info.plist
        run: |
          PLIST_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app/Info.plist"
          
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$PLIST_PATH" || true
          
          ICONS=("AppIconPodcasts" "AppIconMusic" "AppIconBooks" "AppIconMono" "AppIconBarbie" "AppIconPlex" "AppIconTelegram" "AppIconWarp" "AppIconATP")
          
          for ICON in "${ICONS[@]}"; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON dict" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON:CFBundleIconFiles array" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON:CFBundleIconFiles:0 string $ICON" "$PLIST_PATH" || true
          done
          
          echo "✅ 真实备用图标注册信息已成功注入 Info.plist"

      - name: Install ldid
        run: brew install ldid

      - name: Create IPA & Inject Entitlements
        run: |
          APP_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app"
          
          # 1. 主程序注入 (排除扩展的 entitlements 文件)
          MAIN_ENTITLEMENTS=$(find . -name "*.entitlements" | grep -v "NotificationService" | head -n 1)
          
          if [ -n "$MAIN_ENTITLEMENTS" ]; then
            echo "✅ 找到主程序权限文件: $MAIN_ENTITLEMENTS"
            ldid -S"$MAIN_ENTITLEMENTS" "$APP_PATH/Ruddarr"
          else
            echo "⚠️ 未找到主程序权限文件，使用默认签名..."
            ldid -S "$APP_PATH/Ruddarr"
          fi
          
          # 2. 遍历并为所有应用扩展 (App Extensions) 注入基础伪签名
          if [ -d "$APP_PATH/PlugIns" ]; then
            echo "✅ 发现 PlugIns 目录，开始为扩展程序伪签名..."
            find "$APP_PATH/PlugIns" -name "*.appex" | while read appex; do
              # 提取扩展的二进制文件名称 (例如 NotificationService)
              binary_name=$(basename "$appex" .appex)
              echo "  - 正在签名扩展: $binary_name"
              ldid -S "$appex/$binary_name"
            done
          fi
          
          # 3. 打包 IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Ruddarr.ipa Payload
          rm -rf Payload build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ruddarr.ipa
          path: Ruddarr.ipa
