name: Build IPA

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Archive for iOS Device
        run: |
          # 1. 彻底关闭 Xcode 签名，绕过 iOS 26.5 SDK 的 Ad-Hoc 限制
          xcodebuild archive \
            -scheme Ruddarr \
            -archivePath $(pwd)/build/Ruddarr.xcarchive \
            -skipPackagePluginValidation \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Inject Alternate Icons into Info.plist
        run: |
          APP_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app"
          PLIST_PATH="$APP_PATH/Info.plist"
          
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$PLIST_PATH" || true
          
          ICONS=("AppIconPodcasts" "AppIconMusic" "AppIconBooks" "AppIconMono" "AppIconBarbie" "AppIconPlex" "AppIconTelegram" "AppIconWarp" "AppIconATP")
          
          for ICON in "${ICONS[@]}"; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON dict" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON:CFBundleIconFiles array" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$ICON:CFBundleIconFiles:0 string $ICON" "$PLIST_PATH" || true
          done
          
          echo "✅ 真实备用图标注册信息已成功注入 Info.plist"

      - name: Native macOS Codesign & Entitlements Injection
        run: |
          APP_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app"
          
          # 2. 从源码目录提取主程序的权限文件
          MAIN_ENTITLEMENTS=$(find . -name "*.entitlements" | grep -v "NotificationService" | head -n 1)
          
          # 3. 优先使用苹果原生 codesign 工具为应用扩展 (App Extensions) 重签
          if [ -d "$APP_PATH/PlugIns" ]; then
            find "$APP_PATH/PlugIns" -name "*.appex" | while read appex; do
              EXT_NAME=$(basename "$appex" .appex)
              EXT_ENTITLEMENTS=$(find . -name "*.entitlements" | grep "$EXT_NAME" | head -n 1)
              
              echo "  - 正在用 Apple 官方工具重签扩展: $EXT_NAME"
              if [ -n "$EXT_ENTITLEMENTS" ]; then
                codesign --force --sign - --entitlements "$EXT_ENTITLEMENTS" "$appex"
              else
                codesign --force --sign - "$appex"
              fi
            done
          fi
          
          # 4. 使用苹果原生 codesign 工具为主程序重签并注入权限
          echo "✅ 正在用 Apple 官方 codesign 工具重签主程序..."
          if [ -n "$MAIN_ENTITLEMENTS" ]; then
            codesign --force --sign - --entitlements "$MAIN_ENTITLEMENTS" "$APP_PATH"
          else
            codesign --force --sign - "$APP_PATH"
          fi

      - name: Create IPA
        run: |
          APP_PATH="$(pwd)/build/Ruddarr.xcarchive/Products/Applications/Ruddarr.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Ruddarr.ipa Payload
          rm -rf Payload build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ruddarr.ipa
          path: Ruddarr.ipa
